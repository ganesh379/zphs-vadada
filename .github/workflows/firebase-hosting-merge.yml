name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uhayxowapppefwuczsfg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ywT0rcYogZmCiiRhDLfrhg_67k4ofM1
          NEXT_PUBLIC_SUPABASE_URL: https://uhayxowapppefwuczsfg.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ywT0rcYogZmCiiRhDLfrhg_67k4ofM1
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZPHS_VADADA }}
          channelId: live
          projectId: zphs-vadada
